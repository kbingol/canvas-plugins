name: Validate distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate upstream schemas and package boundaries
        run: python scripts/validate.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Build reproducible plugin archive
        run: python scripts/package.py
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install the verified Codex client
        run: npm install --global @openai/codex@0.163.0
      - name: Install, discover and call tools without model inference
        run: python scripts/test_install.py
      - name: Verify custom-port compatibility
        run: python scripts/test_install.py --fixture-port 51098 --artifacts artifacts/custom-port
